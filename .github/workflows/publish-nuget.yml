name: Publish NuGet Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, for example 1.0.0 or 1.0.0-beta.1'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    name: Pack and publish ShadowGuard.Core
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Validate version
        run: |
          if ('${{ inputs.version }}' -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$') {
            throw 'Version must look like 1.0.0 or 1.0.0-beta.1'
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
          source-url: https://nuget.pkg.github.com/Fannar-afk/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore .\shadowguard.sln

      - name: Build
        run: dotnet build .\ShadowGuard.Core\ShadowGuard.Core.csproj --configuration Release --no-restore /p:Version=${{ inputs.version }}

      - name: Pack
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\nuget | Out-Null
          dotnet pack .\ShadowGuard.Core\ShadowGuard.Core.csproj `
            --configuration Release `
            --no-build `
            --output .\artifacts\nuget `
            /p:Version=${{ inputs.version }} `
            /p:PackageVersion=${{ inputs.version }}

      - name: Publish to GitHub Packages
        run: dotnet nuget push .\artifacts\nuget\*.nupkg --source github --api-key $env:NUGET_AUTH_TOKEN --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
