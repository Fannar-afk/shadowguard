name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.12'
        required: true
        default: 'v1.0.12'
      prerelease:
        description: 'Mark this release as a pre-release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

concurrency:
  group: shadowguard-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Show runner information
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          pwsh --version

      - name: Validate version
        run: |
          if ('${{ inputs.version }}' -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$') {
            throw 'Version must look like v1.0.0 or v1.0.0-beta.1'
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore .\shadowguard.sln

      - name: Build
        run: dotnet build .\shadowguard.sln --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test .\ShadowGuard.Tests\ShadowGuard.Tests.csproj --configuration Release --no-build --logger trx --results-directory .\artifacts\test-results

      - name: Run CLI smoke test from source
        run: dotnet run --project .\ShadowGuard.Cli\ShadowGuard.Cli.csproj --configuration Release --no-build -- --path .\samples\demo-npm-risk --plugins .\plugins --validate-sbom --fail-on-invalid-sbom --out .\artifacts\cli-report.json

      - name: Publish desktop win-x64
        run: dotnet publish .\ShadowGuard\ShadowGuard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o .\artifacts\publish

      - name: Publish CLI win-x64
        run: dotnet publish .\ShadowGuard.Cli\ShadowGuard.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o .\artifacts\publish

      - name: Verify packaged CLI
        run: |
          .\artifacts\publish\shadowguard-cli.exe --help
          .\artifacts\publish\shadowguard-cli.exe --path .\artifacts\publish\samples\demo-npm-risk --plugins .\artifacts\publish\plugins --validate-sbom --fail-on-invalid-sbom --out .\artifacts\published-cli-report.json

      - name: Verify release payload
        run: .\tools\Verify-ReleasePayload.ps1 -PublishDir .\artifacts\publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installer | Out-Null
          $env:SHADOWGUARD_VERSION = '${{ inputs.version }}'.TrimStart('v')
          $env:SHADOWGUARD_PUBLISH_DIR = (Resolve-Path .\artifacts\publish).Path
          $env:SHADOWGUARD_OUTPUT_DIR = (Resolve-Path .\artifacts\installer).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\package\ShadowGuard.iss

      - name: Archive portable build
        run: Compress-Archive -Path .\artifacts\publish\* -DestinationPath .\artifacts\ShadowGuard-portable-win-x64.zip -Force

      - name: Generate SHA256 checksums
        run: |
          $files = @(
            '.\artifacts\installer\ShadowGuard-Setup.exe',
            '.\artifacts\ShadowGuard-portable-win-x64.zip'
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file
            "$($hash.Hash.ToLowerInvariant())  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -Encoding ascii .\artifacts\SHA256SUMS.txt
          Get-Content .\artifacts\SHA256SUMS.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadowGuard-release-test-results
          path: .\artifacts\test-results\*.trx

      - name: Upload release assets as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShadowGuard-release-assets
          path: |
            artifacts/installer/ShadowGuard-Setup.exe
            artifacts/ShadowGuard-portable-win-x64.zip
            artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ShadowGuard ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/installer/ShadowGuard-Setup.exe
            artifacts/ShadowGuard-portable-win-x64.zip
            artifacts/SHA256SUMS.txt
